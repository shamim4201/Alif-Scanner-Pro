name: Build Alif Scanner Pro (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses & verify gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      # Decode debug.keystore from debug.keystore.base64 for signing validation
      - name: Restore Keystores for Signing
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
          fi

      - name: Build Debug APK, Release APK & Play Store AAB
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --stacktrace
          else
            gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --stacktrace
          fi

      # 1. Download Option 1: Release APK (Compact APK)
      - name: Upload Release APK (Option 1)
        uses: actions/upload-artifact@v7
        with:
          name: Alif-Scanner-Pro-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 2. Download Option 2: Debug APK (Universal Install on any Android Phone)
      - name: Upload Debug APK (Option 2 - Universal Install)
        uses: actions/upload-artifact@v7
        with:
          name: Alif-Scanner-Pro-Debug-APK-Universal
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 3. Download Option 3: AAB File (For Google Play Store Release)
      - name: Upload Google Play Store AAB Bundle (Option 3)
        uses: actions/upload-artifact@v7
        with:
          name: Alif-Scanner-Pro-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
