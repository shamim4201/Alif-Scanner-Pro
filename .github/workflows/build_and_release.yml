name: Build Alif Scanner Pro (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses & verify gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      # Decode debug.keystore and release upload keystore for signing
      - name: Restore Keystores for Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'alifrelease2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'alifupload' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'alifrelease2026' }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ -f my-upload-key.jks.base64 ]; then
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Alif Scanner Pro,OU=Mobile Apps,O=Alif Scanner Pro,L=Dhaka,ST=Dhaka,C=BD"
          fi

      - name: Restore google-services.json (if GitHub Secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
          fi

      - name: Build Debug APK (Universal Install)
        run: |
          set -o pipefail
          CMD="./gradlew"
          if [ ! -f gradlew ]; then CMD="gradle"; fi
          if ! $CMD :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Djava.awt.headless=true -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=daemon --console=plain 2>&1 | tee debug-build.log; then
            echo "================ EXACT DEBUG ERROR ================"
            grep -E -A 10 "FAILURE:|What went wrong:|Execution failed|Caused by:|^e: " debug-build.log | tail -n 40 || tail -n 40 debug-build.log
            echo "==================================================="
            {
              echo "### Debug Build Failed"
              echo '```'
              grep -E -A 10 "FAILURE:|What went wrong:|Execution failed|Caused by:|^e: " debug-build.log | head -n 60 || tail -n 50 debug-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build Release APK & Play Store AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'alifrelease2026' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'alifupload' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'alifrelease2026' }}
        run: |
          set -o pipefail
          CMD="./gradlew"
          if [ ! -f gradlew ]; then CMD="gradle"; fi
          if ! $CMD :app:assembleRelease :app:bundleRelease --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Djava.awt.headless=true -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=daemon --console=plain 2>&1 | tee release-build.log; then
            echo "=============== EXACT RELEASE ERROR ==============="
            grep -E -A 10 "FAILURE:|What went wrong:|Execution failed|Caused by:|^e: " release-build.log | tail -n 40 || tail -n 40 release-build.log
            echo "==================================================="
            {
              echo "### Release / AAB Build Failed"
              echo '```'
              grep -E -A 10 "FAILURE:|What went wrong:|Execution failed|Caused by:|^e: " release-build.log | head -n 60 || tail -n 50 release-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "AAB Signing Certificate:"
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner:|Issuer:|SHA1:|SHA256:" || true

      # Upload build logs if failure occurs for instant inspection
      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Build-Error-Logs
          path: |
            debug-build.log
            release-build.log
          if-no-files-found: ignore
          retention-days: 7

      # 1. Download Option 1: Release APK (Compact APK)
      - name: Upload Release APK (Option 1)
        uses: actions/upload-artifact@v7
        with:
          name: Alif-Scanner-Pro-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 2. Download Option 2: Debug APK (Universal Install on any Android Phone)
      - name: Upload Debug APK (Option 2 - Universal Install)
        uses: actions/upload-artifact@v7
        with:
          name: Alif-Scanner-Pro-Debug-APK-Universal
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 3. Download Option 3: AAB File (For Google Play Store Release)
      - name: Upload Google Play Store AAB Bundle (Option 3)
        uses: actions/upload-artifact@v7
        with:
          name: Alif-Scanner-Pro-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
